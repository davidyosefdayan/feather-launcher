# Builds the real Feather from every merge to main, signed with the release key, and publishes it
# as the "beta" pre-release, replacing the one before. GitHub never counts a pre-release as the
# latest release, so the in-app updater keeps offering only real releases.
#
# The release key is in the "beta" environment's secrets, which only main can use, so pull
# requests and forks can't reach it.
name: Beta

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: beta

jobs:
  beta:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      # Full history: the versionCode is the number of commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "The release key secrets aren't set in the beta environment"; exit 1; }
          mkdir -p setup
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > setup/feather-release.jks
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$PWD/setup/feather-release.jks"
            echo "storePassword=$(esc "$STORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > setup/keystore.properties
      - run: ./gradlew assembleRelease -Pbeta
      - run: rm -rf setup
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk FeatherLauncher-beta.apk
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          version=$("$aapt2" dump badging FeatherLauncher-beta.apk 2>/dev/null \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          last=$(git describe --tags --abbrev=0 --match 'v*')
          notes="A test build of what's on main, not a release yet: $(git log -1 --format=%s).

          Installs over Feather Launcher. Once you have a beta, the next real release updates it as usual.

          **Changes since ${last#v}:** https://github.com/$GITHUB_REPOSITORY/compare/$last...$GITHUB_SHA"
          notes=$(printf '%s\n' "$notes" | sed 's/^          //')
          gh release delete beta --cleanup-tag --yes || true
          gh release create beta FeatherLauncher-beta.apk --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Feather Launcher $version" --notes "$notes"
